name: knowledge-base-agent-config
version: 1.0.0
description: Agent configuration for the knowledge-base project
author: yamakura-yuma

targets:
- claude

# The shared harness (rules, guard hooks, core-* skills) from the dotfiles repo.
# Our own package follows main; external packages are pinned by commit.
# `apm install` lands it in ./.claude/, never in ~/.claude/.
dependencies:
  apm:
  - git: https://github.com/yamakura-yuma/dotfiles.git
    path: core-principal
    ref: main
    alias: core-principal
    targets:
    - claude
  # Page-lead helpers (see CLAUDE.md), pinned by commit.
  - git: https://github.com/dreambigou/eli5.git
    path: skills/eli5
    ref: a766623b062331fdde53467001379b4ddf3acc2f
    alias: eli5
    targets:
    - claude
  - git: https://github.com/tt-a1i/archify.git
    path: archify
    ref: 9e35d2b0b39b155553ba9fcfe0b4f2a5198dd993
    alias: archify
    targets:
    - claude
  - git: https://github.com/pbakaus/impeccable.git
    path: .claude/skills/impeccable
    ref: 9d715cc4f5564a990ca8345abfdd5df6dc9b41c8
    alias: impeccable
    targets:
    - claude
  mcp: []

includes: auto
scripts: {}
