name: knowledge-base-agent-config
version: 1.0.0
description: Agent configuration for the knowledge-base project
author: yamakura-yuma

targets:
- claude

# The shared harness (rules, guard hooks, core-* skills) from the dotfiles repo,
# pinned by commit because upstream publishes no tags; bump with `apm update`.
# `apm install` lands it in ./.claude/, never in ~/.claude/.
dependencies:
  apm:
  - git: https://github.com/yamakura-yuma/dotfiles.git
    path: core-principal
    ref: fa39bcaf4d782a254166e8fda1b793d3af196cd7
    alias: core-principal
    targets:
    - claude
  mcp: []

includes: auto
scripts: {}
