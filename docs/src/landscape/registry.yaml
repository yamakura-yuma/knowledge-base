# AI コーディングツール・ランドスケープ レジストリ
#
# このファイルが全項目の正本。詳細ティア (tier: detail) の項目は docs/src/landscape/tools/<slug>.md に
# 本文を持ち、frontmatter はこのファイルから生成せずファイル側に置く。
# 履歴ティア (tier: history) はこのファイルの 1 ブロックだけで完結する。
#
# verified が null の項目は「まだ裏取りしていない」ことを意味する。build.py が警告を出す。
# 推測で値を埋めないこと。分からないものは null のままにする。

meta:
  schema_version: 1
  # 層の定義。主軸は「リクエストが通る経路上の位置」。
  layers:
    L0:
      name: モデル提供元
      note: ツールではない。参考として並べる。
    L1:
      name: エージェント本体
      note: 人が指示を出す面と、計画・ツール実行のループ。副軸 placement で実行場所を分ける。
    L2:
      name: モデルアクセス層
      note: ルーティング・課金・圧縮・観測。エージェントとモデルの間に挟まる。
    L3:
      name: 共通基盤
      note: >-
        プロトコル・配布・指示形式など全層の下敷き。分類は暫定。subkind に気づいた性格を
        記録しているが、HTML には出さない。割り方が見えた時点で割り直す。
  placements:
    terminal: ターミナルで動く CLI
    ide: IDE / エディタ拡張
    cloud: クラウドで非同期に走る
  # 「ホット」の判定基準。fetch_metrics.py が取った実測値から build.py が機械的に決める。
  status_rules:
    active: 直近 90 日以内にリリースがある
    hot: active かつ、直近 90 日のリリース数が 3 以上、または star が直近に大きく伸びた
    maintenance: README の冒頭で保守モード（新機能を受けず、修正と依存更新だけを続ける）を告知している。fetch_metrics.py が検知して metrics に語句を残す。ended より下、hot / active / stale より上
    stale: 6 か月以上リリースがない
    ended: 公式にアーカイブ・統合・提供終了した

