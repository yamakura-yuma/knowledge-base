  # L1 / terminal — ターミナルで動くエージェント CLI
  # 母集団の出発点は Headroom の `headroom wrap` 対応リスト (README.md:49)。
  # 実在の統合プロジェクトが「対応する価値がある」と判断した 15 個。
  # ============================================================

