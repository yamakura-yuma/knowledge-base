    reports:
      - article: hn:47193064
        polarity: positive
        quote: "Built it for my own Claude Code sessions first. Noticed I could work 6x longer before context degradation."
        note: スクリプトを別プロセスで走らせて stdout だけ返すようにしたら、315KB の生出力が 5.4KB になり、劣化までの時間が約 6 倍に延びた（作者本人の報告）

  - id: black-box-scripts
    name: 付属スクリプトは読まずに実行する
