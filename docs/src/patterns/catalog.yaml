    effort: 3
    gain: 作業の並びをその場で組み立てられる
    cost: Orca のタスク DAG で足りており、スクリプト実行の基盤を別に作ることになる
    self: [core-principal/apm.yml（Orca の orchestration スキル）]
    note: Orca のタスク DAG を coordinator が組める。スクリプトとして書いて実行する形ではない
    sources:
      - source: deepseek-harness
        url: https://github.com/deepseek-ai/deepseek-harness/blob/master/docs/subsystems/workflow.md
        evidence: The workflow seam lets an agent run a model-written orchestration SCRIPT that starts subagents.

  - id: headless-pipeline
    name: 非対話実行をスクリプトや CI に組み込む
    layer: graph
    problem: エージェントをパイプラインの 1 段にし、後段が機械的に読める出力を得る
    state: partial
    impact: 1
    effort: 2
    gain: 行動評価を CI で毎回回せる
    cost: 1 回の実行ごとに API 費用がかかる（それが make ci から外した理由）
    self: [core-principal/tests/eval/run.sh]
    note: 行動評価で claude -p を使うだけ。make ci には入れていない
    sources:
      - source: claude-code
        url: https://code.claude.com/docs/en/headless
        evidence: To get output conforming to a specific schema, use `--output-format json` with `--json-schema`
      - source: codex-cli
        url: https://developers.openai.com/codex/noninteractive
        evidence: If you need to continue a previous run (for example, a two-stage pipeline), use the `resume` subcommand

  - id: event-triggered-agents
    name: 外部イベント（PR・チャット）を起点にエージェントを立てる
    layer: graph
    problem: 人が起動しなくても、レビューやトリアージを決まった契機で走らせる
    state: missing
    impact: 2
    effort: 3
    gain: PR のレビューを人が起動しなくても走らせられる
    cost: GitHub Actions か常駐の受け口が要り、ハーネスの外に基盤が増える
    sources:
      - source: deepseek-harness
        url: https://github.com/deepseek-ai/deepseek-harness/blob/master/docs/user/guide/github-review.md
        evidence: When a pull request in the configured repository changes from draft to ready for review, the rule creates a titled root Session
      - source: cursor-pstack
        url: https://github.com/cursor/plugins/blob/main/pstack/automations/benny/README.md
        evidence: one triages each report. the other reproduces confirmed bugs and may prepare a small draft fix.
    reports:
      - article: zenn:e3f648e335a947
        polarity: positive
        quote: "自動でエラー原因の分析からソース修正のプルリクエスト作成までをおこなわせるフローを回している"
        note: 監視ボットが障害ログを送ると原因分析から修正 PR まで自動で進み、人は翌朝マージを承認するだけになった

  # =================================================================== 記事の使用報告から足した型
  # 公式ドキュメントや README の出典が無く、根拠は reports（記事）だけ。sources は空にしてある。

  - id: path-scoped-rules
    name: パスに条件を付けたルールを、該当ファイルに触れたときだけ読ませる
    layer: prompt
    problem: 常設の指示ファイルに規約を並べると毎回文脈を食い、会話の後半では埋もれて守られない
    state: partial
    impact: 2
    effort: 1
    gain: 規約を触るファイルの種類ごとに分け、常設の文面を減らせる
    cost: apm の applyTo に glob を書いた instructions を足すだけ
    self: [core-principal/.apm/instructions/core-principal.instructions.md]
    note: "apm の applyTo で置き場所はあるが、使っているのは全ファイル対象（\"**\"）の 1 本だけ"
    sources: []
    reports:
      - article: zenn:65b9a99d22ce2b
        polarity: positive
        quote: "そのタイミングで注入されたルールは、セッション開幕に注入されたCLAUDE.mdよりも新しいメッセージなのでよく効きます。"
        note: 該当ファイルを初めて編集した時点で注入されるルールは、冒頭の CLAUDE.md より新しいので守られやすい、という主張。実測ではない

  - id: grill-before-plan
    name: 計画の前に、一問ずつ質問攻めにして認識を揃える
    layer: loop
    problem: 曖昧な依頼のまま計画や実装に入り、途中で前提の食い違いが見つかる
    state: adopted
    self: [core-principal/apm.yml]
    note: mattpocock/skills の grill-me と grilling をコミット固定で取り込んでいる
    sources: []
    reports:
      - article: zenn:8783c6b3ead2cb
        polarity: positive
        quote: "こんな短い記述で何が変わるの？という感じですが、コーディングエージェントの挙動がガラッと変わります。"
        note: /grill-me に大まかな要望を添えると選択肢付きの質問が続き、終わる頃には要件と実装方針が固まっていた

  - id: context-pressure-halt
    name: 文脈が逼迫したら、近道せずに区切りを宣言させる
    layer: loop
    problem: 文脈の残りが少なくなると、読まずに書く・検証を省くなどの近道で品質が落ちる
    state: missing
    impact: 2
    effort: 1
    gain: 長い作業の終盤で検証を飛ばした成果物が出るのを減らす
    cost: 常駐ルールに数行の規範を足すだけ
    sources: []
    reports:
      - article: qiita:1ad4e4ccaf47816c63e0
        polarity: positive
        quote: "この規範を入れてから、「コンテキストが残り少ないため、ここで区切ります」と宣言してくれるようになりました。"
        note: 「焦ったら止まれ」節（読まずに書かない・検証を省かない）を CLAUDE.md に書いたら、残りが少ないときに近道せず区切るようになった

  - id: verify-reference-exists
    name: 参照する前に、そのシンボルの実在を確かめさせる
    layer: loop
    problem: 存在しないメソッドや関係をもっともらしく呼ぶ幻覚のバグが紛れ込む
    state: missing
    impact: 2
    effort: 1
    gain: 実在しないシンボルを呼ぶ種類のバグを、実装の段階で潰せる
    cost: 実装手順に「使う前に grep か codegraph で探す」を 1 段足すだけ
    note: core-tools は索引の引き方を定めるが、参照前の確認を必須にはしていない
    sources: []
    reports:
      - article: devto:3335508
        polarity: positive
        quote: "This one change alone eliminated an entire class of bugs in my project."
        note: 実装前に、使うモデル・メソッド・定数を 1 つずつ grep で探す段階を入れたら、存在しない関係を呼ぶバグが出なくなった

  - id: oscillation-directive
    name: 修正ループの振り子を検出し、良い方を指示として固定する
    layer: loop
    problem: レビューと修正を回すと、同じ箇所が A → B → A と行き来して収束しない
    state: missing
    impact: 1
    effort: 2
    gain: 自動のレビュー・修正ループが同じ箇所で往復し続けるのを止める
    cost: 反復ごとの差分を比べるステップを新しく書く
    sources: []
    reports:
      - article: zenn:1c6c3b9333117c
        polarity: positive
        quote: "fixステップはdirectiveに従う義務があるので、振り子が止まる。"
        note: 反復ごとのコミット差分から振り子を検出し、良い方を directive として固定したら往復が止まった

  - id: lint-as-guardrail
    name: 規約はプロンプトでなく linter とフックで強制する
    layer: harness
    problem: コードスタイルや import の方向を指示ファイルに書いても、一定の確率で破られる
    state: missing
    impact: 2
    effort: 2
    gain: 規約違反をモデルの注意力に頼らず機械的に止め、指示ファイルも短くなる
    cost: リポジトリごとの linter 設定と、Stop か PostToolUse のフックを書く
    note: core-retro は「機械で止められるなら linter やフックにする」と定めるが、linter を走らせるフックは無い
    sources: []
    reports:
      - article: hn:46098838
        polarity: positive
        quote: "consider setting up a Claude Code Stop hook that runs your formatter & linter and presents errors to Claude for it to fix"
        note: スタイルを CLAUDE.md に書く代わりに、Stop フックで formatter と linter を走らせて直させる。提案であって計測ではない
      - article: zenn:2512-full-ai-cofing
        polarity: mixed
        quote: "ただし eslint を厳しく締め付けすぎると、矛盾が生じやすく、タスクが失敗したり、コンテキスト消耗が増える傾向"
        note: 悪いコードを lint 必須で止めている一方、締め付けすぎるとタスクが失敗し、文脈の消費が増え、抜け道を探し始めた

  - id: mcp-budget-cli-first
    name: 常時つなぐ MCP を絞り、長い外部呼び出しは CLI で呼ぶ
    layer: harness
    problem: MCP サーバーのスキーマが毎リクエスト文脈を食い、長い呼び出しは返るまで中が見えない
    state: partial
    impact: 2
    effort: 1
    gain: 毎リクエストの固定費が減り、外部エージェントの進み具合を見て途中で止められる
    cost: MCP を足す前に CLI で済むかを確かめる、という判断基準を core-tools に書き足す
    self: [core-principal/.apm/skills/core-tools/SKILL.md, host-apm.yml]
    note: MCP はホスト単位に限り、Serena は実測で入れないと決めてある。CLI を先に選ぶ基準は書いていない
    sources: []
    reports:
      - article: hn:48883275
        polarity: positive
        quote: "roughly 1,000 to 1,400 tokens per small server, per request."
        note: 小さな MCP サーバー 1 つで毎リクエスト約 1,000〜1,400 トークン。MCP 4 つ＋プラグイン＋指示ファイルで初回リクエストが約 7.5 万トークンになった
      - article: zenn:63d325934ba0de
        polarity: positive
        quote: "MCPツールは結果が返るまでブラックボックスになるため、長時間実行されるタスクには向いていません。"
        note: Codex を MCP で呼ぶと数十分なにも返らなかったので、スキルから codex exec を実行する形に替え、出力を見て途中で止められるようにした

  - id: rewind-side-questions
    name: 脇道の質問は巻き戻すか、別のセッションに分ける
    layer: harness
    problem: 本筋と関係ない質問のやり取りが文脈に残り、続きの作業のノイズになる
    state: missing
    impact: 1
    effort: 1
    gain: 調べ物のやり取りで本筋の文脈を汚さない
    cost: /rewind と /fork の使いどころを core-tools に 1 段落書くだけ
    sources: []
    reports:
      - article: zenn:b7fad1a0c52481
        polarity: positive
        quote: "パワハラ質問タイムのやり取りをなかったことになるので、ノイズなしにすっきりした状態で気持ちよく作業してくれます。"
        note: 生成コードを質問攻めにした後、次の依頼の前に /rewind で質問部分を消したら、ノイズの無い文脈で作業が進んだ


# AI slop 対策。ハーネスの 4 層とは別の軸で、AI が書いた文章・コード・UI の質の低さを
# 防ぐ・消す型。4 層の件数や「次に取り込む候補」には数えない。形式は patterns と同じで、
# target に対象（文章 / コード / UI など）を書く。
slop_findings: >-
  文章の AI 臭を消す型は採用済（humanizer-ja と japanese-tech-writing）。記事の報告では、文体の規則で消えるのは表面だけで、
  書く意図が無いことによる違和感は残るという声が多い。コードの slop を差分から消す型（deslop）と、UI の典型の見た目を避ける型は無い。
slop_patterns:
  - id: prose-unslop
    name: 文章の AI 臭を、書いた後に機械的な規則で消す
    target: 文章
    problem: 生成した文章に定型の言い回し・過剰な太字・ダッシュなどが残り、読み手に AI が書いたと見抜かれる
    state: adopted
    self: [core-principal/apm.yml（humanizer-ja、japanese-tech-writing）]
    note: 日本語は humanizer-ja と japanese-tech-writing を依存に取っている。英語向けの規則は入れていない
    sources:
      - source: humanizer
        url: https://github.com/blader/humanizer/blob/main/README.md
        evidence: "Humanizer rewrites AI-sounding text so it reads like a person wrote it, without changing what it says."
      - source: cursor-pstack
        url: https://github.com/cursor/plugins/blob/main/pstack/skills/unslop/SKILL.md
        evidence: "Cut AI tells from any writing. Must always apply."
      - source: humanizer-ja
        url: https://github.com/gonta223/humanizer-ja/blob/main/README.md
        evidence: "このスキルは、そういったAIパターンを20項目に分類し、Claude Codeが文章を生成する時点で自動的に回避するようにするものです。"
    reports:
      - article: zenn:ai-likeness-not-about-writing-style
        polarity: mixed
        quote: "ある程度は改善しました。表面的なAIっぽさは確かに減ります。"
        note: 定型表現の禁止や箇条書きの削減をプロンプトに入れると表面の AI 臭は減ったが、根本の違和感は消えなかった
      - article: zenn:ai-likeness-not-about-writing-style
        polarity: negative
        quote: "それでもAIっぽさが残りました。"
        note: 人間らしさの軸を持つ評価プロンプトと文体チェックリストで点検させても、書く動機が抜けていて AI 臭が残った
      - article: reddit:1wdmdhp
        polarity: positive
        quote: "The two most useful are unslop and deslop, make both code and docs look human written."
        note: pstack を Claude Code に移した投稿への返信。いちばん役立ったのは unslop と deslop だという（score 1 のコメント 1 件）

  - id: code-deslop
    name: ブランチの差分から、コードの slop を消す
    target: コード
    problem: 不要なコメント、信頼できる経路での防御的チェック、型を黙らせるキャストなどが差分に紛れ込む
    state: partial
    impact: 2
    effort: 1
    gain: レビューに回る前に、コードの slop を差分の範囲で消せる
    cost: deslop 相当のスキルを 1 つ依存に足す
    self: [core-principal/apm.yml（ponytail-review）]
    note: 過剰設計を削る ponytail-review はある。コメントや防御的チェックを消す手順は無い
    sources:
      - source: cursor-pstack
        url: https://github.com/cursor/plugins/blob/main/cursor-team-kit/skills/deslop/SKILL.md
        evidence: "Check the diff against main and remove AI-generated slop introduced in the branch."
      - source: cursor-pstack
        url: https://github.com/cursor/plugins/blob/main/pstack/docs/guide/05-build-and-clean.md
        evidence: "`/deslop` cleans slop out of the code, `/unslop` cleans it out of prose, and `/no-comments` hands the comments to a reviewer who didn't write them."
      - source: ponytail
        url: https://github.com/DietrichGebert/ponytail/blob/main/skills/ponytail-review/SKILL.md
        evidence: "Code review focused exclusively on over-engineering."
    reports:
      - article: reddit:1wdmdhp
        polarity: positive
        quote: "The two most useful are unslop and deslop, make both code and docs look human written."
        note: unslop と並んで deslop が最も役立ったという返信（score 1）

  - id: design-anti-slop
    name: UI の AI 臭を、デザイン規範のスキルで避ける
    target: UI
    problem: 指定なしで UI を作らせると、紫のグラデーションやガラス風の、典型的な AI 生成の見た目になる
    state: missing
    impact: 1
    effort: 1
    gain: UI を作らせたときの典型の見た目を避けられる
    cost: frontend-design などのデザイン用スキルを依存に足すだけ
    sources:
      - source: anthropic-skills
        url: https://github.com/anthropics/skills/blob/main/skills/frontend-design/SKILL.md
        evidence: "fade-and-slide-up entrances on each section and hover transitions on every card are the generic default and read as AI-generated."
    reports:
      - article: zenn:apple_design_skills
        polarity: negative
        quote: "全体として紫系統だったり、妙にグラデーションが多かったりと、よくあるAI生成UIになっています。"
        note: スキル無しで設定画面を作らせると典型の AI 生成 UI になった（対策前の比較基準）
      - article: zenn:apple_design_skills
        polarity: mixed
        quote: "その他、全体としてApple風かどうかを正確に判別するのは難しいかもしれません。"
        note: Apple のガイドラインをスキルにして読ませると統一感は出たが、狙いどおりかは筆者にも判別しきれない
      - article: zenn:04387b258ba54e
        polarity: mixed
        quote: "1度実行しただけでは 「AIスロップ」は取り除けても「AI臭」 は抜けきらない"
        note: /frontend-design で派手な CSS は直ったが、言葉にしにくい AI 臭は残った
      - article: zenn:04387b258ba54e
        polarity: positive
        quote: "なんだか最初の手実装CSSに先祖返りしたような気がしないでもないですが、ついにAIに温かみのあるUIを実装させることに成功しました！"
        note: 人が AI っぽくないと判定するまで 5〜6 回直させると AI 臭が消えた。ただし最初の手書き CSS に近い見た目に戻った

  - id: read-before-share
    name: AI の出力は人が読んで削ってから共有し、使ったことを明かす
    target: 文章・コード
    problem: 読まずに貼った AI の出力が、確認の手間を受け手（レビュアー、コミュニティ）に押し付ける
    state: missing
    impact: 1
    effort: 1
    gain: PR や報告を受け取る側の確認の手間を減らす
    cost: core-dispatch の報告の形に「読んで削った」と「AI を使った箇所」を足すだけ
    sources: []
    reports:
      - article: hn:47389570
        polarity: mixed
        quote: "Read. Read the output before you share it. If you haven't read it, you don't know whether it's correct, relevant, or current."
        note: 共有する前に人が読み、確かめ、削る、という指針。効果の計測は無い
      - article: hn:48053203
        polarity: negative
        quote: "If you dump a complex PR into a project without due care, you’re obligating the reviewers to go through the code and for them to explain to you why it can’t be merged."
        note: 確かめていない AI の PR はレビューの手間をメンテナに押し付け、AI の貢献を閉じるプロジェクトが出ている
      - article: hn:48053203
        polarity: mixed
        quote: "another way of showing respect to the community is to be very open and clear about if, how, and where you’re using AI in your contribution"
        note: 貢献のどこに AI を使ったかを明かすことを提案している。試した結果ではない

  - id: verify-incoming-slop
    name: 外から来た AI 生成の報告は、再現と実在確認で弾く
    target: コード・報告
    problem: もっともらしい脆弱性報告や PR が大量に届き、どれが実在する問題か見分けられない
    state: missing
    impact: 1
    effort: 2
    gain: 存在しない関数や再現しない不具合を引く報告を、読む前に機械で弾ける
    cost: 報告の PoC を隔離環境で走らせ、引用されたシンボルと行番号を実在確認するスクリプトを書く
    sources: []
    reports:
      - article: hn:49154332
        polarity: positive
        quote: "Feed each advisory's PoC SQL statements verbatim into the compiled SQLite binaries under AddressSanitizer (ASan) instrumentation to detect memory bugs."
        note: AI 生成が疑われる SQLite の脆弱性報告を隔離環境で再現させ、55 件中 54 件が捏造だと示した
      - article: hn:49154332
        polarity: positive
        quote: "Non-existent Code References: Citing functions that do not exist in the claimed target version or line numbers past EOF."
        note: 引用された関数と行番号を対象の版のソースと突き合わせると、存在しない関数やファイル末尾を超える行番号が見つかった
      - article: hn:49154332
        polarity: positive
        quote: "All advisories in this repo seem AI generated when testing them with Gptzero"
        note: AI 文章の検出器にかけると全件が AI 生成と判定され、slop である裏付けの 1 つになった
      - article: hn:49007247
        polarity: positive
        quote: "Pangram feels different. I’ve tested it and it’s dismayingly effective"
        note: AI 文章の検出器に懐疑的だった筆者が Pangram を試し、よく当たると判断した

# 名前の挙がったハーネスの評判。本数と反応数は articles.json の reputation（題名に名前を含む
# 記事を機械的に数えたもの）から描く。ここには読んで拾った使用報告の引用だけを書く。
reputation_finding: >-
  poteto-mode（pstack）は、題名に名前を含む記事が Zenn の解説 1 本と、Hacker News の作者本人の告知とガイドへのリンク（各 1〜2pt）だけで、第三者の使用報告は
  見つからなかった（last30days-skill で Reddit を引くと、pstack を勧める返信が 1 件あった）。X での評判は、これらの媒体の記事の数には表れていない。Devin と DeepSeek Harness は
