patterns:
  # =================================================================== prompt
  - id: layered-instruction-files
    name: 階層化した常設の指示ファイル
    layer: prompt
    problem: 全体の規約とディレクトリ別の上書きを、必要な範囲にだけ毎セッション読ませる
    state: adopted
    self: [core-principal/.apm/instructions/core-principal.instructions.md, AGENTS.md]
    sources:
      - source: claude-code
        url: https://code.claude.com/docs/en/memory
        evidence: CLAUDE.md and CLAUDE.local.md files in the directory hierarchy above the working directory are loaded at launch.
      - source: codex-cli
        url: https://developers.openai.com/codex/guides/agents-md
        evidence: Files closer to your current directory override earlier guidance because they appear later in the combined prompt.
    reports:
      - article: zenn:2512-full-ai-cofing
        polarity: mixed
        quote: "LLM は「無理矢理にでも質問を生み出す。些細な矛盾点をつつく」という状態に陥ります"
        note: 「矛盾点は必ず質問しろ」のような汎用の常設指示は、入れっぱなしにすると質問をこじつけ始めた
      - article: zenn:65b9a99d22ce2b
        polarity: negative
        quote: "セッションが長くなるにつれて守られなくなる可能性があります。"
        note: 常設の CLAUDE.md に置いたルールは会話に埋もれていく、という指摘。観測ではなく推論
      - article: hn:46098838
        polarity: mixed
        quote: "As a result, Claude will ignore the contents of your CLAUDE.md if it decides that it is not relevant to its current task."
        note: プロキシで見ると CLAUDE.md は「関係なければ無視してよい」という注記付きで注入されており、どの作業にも当てはまる内容でないと無視されやすい
      - article: hn:48883275
        polarity: negative
        quote: "Claude Code 2.1.207 ignored AGENTS.md entirely and only ingested the file when renamed CLAUDE.md"
        note: 72KB の指示ファイルで毎リクエスト約 2 万トークン増えた。加えて当時の版は AGENTS.md を黙って無視していた
      - article: devto:3335508
        polarity: negative
        quote: "even with a decent CLAUDE.md, I was still babysitting every session."
        note: CLAUDE.md に規約を書いても TDD やテスト実行を毎回言い直す必要があったので、手順をスキルに移した

  - id: rule-as-pointer
    name: 常駐ルールは規範と橋渡しだけにする
    layer: prompt
    problem: 毎プロンプト読まれるファイルが肥大して文脈を食うのを防ぐ。説明はスキルへ逃がす
    state: adopted
    self: [core-principal/.apm/instructions/core-principal.instructions.md]
    sources:
      - source: self
        url: https://github.com/yamakura-yuma/dotfiles/blob/main/core-principal/.apm/instructions/core-principal.instructions.md
        evidence: このファイルは毎プロンプト読み込まれる。だから内容は、数行で完結する規範か、「この場面ではこれを使う」という橋渡しだけに限る。
    reports:
      - article: zenn:65b9a99d22ce2b
        polarity: positive
        quote: "例えば50行のルールをCLAUDE.mdに書くということは、毎回のセッションで50行分のコンテキストを無条件に消費するということです。"
        note: CLAUDE.md は開始時に要る情報だけに絞り、規約類は外へ出す。公式仕様からの推論で、実測は無い
      - article: qiita:356e5f1dba112a075be1
        polarity: positive
        quote: "`git status` を聞いただけのターンでも、その2000行ぶんのトークンを毎回お前が払っている。"
        note: CLAUDE.md を数行に削り、特定の作業にだけ要る知識はスキルへ移せと勧める（一般論寄り）
      - article: qiita:d6c83ea50b82e1c2602c
        polarity: positive
        quote: "35行に削って残りを`.claude/rules/`に分離したCLAUDE.md。同じ指示を出しても、後者の方がClaudeの出力品質が明らかに高いのです。"
        note: CLAUDE.md を 100 行から 35 行に削り、規約を paths 指定のルールへ移したら出力が良くなった（Before/After 1 例）
      - article: qiita:1ad4e4ccaf47816c63e0
        polarity: positive
        quote: "結果、Claude Codeは重要な指示を見落とすことが増えました。コンテキストの優先度が平坦になり、何が重要かわからなくなっていたのです。"
        note: 200 行を超える CLAUDE.md で見落としが増えたので、判断に関わる情報だけを残し、規約は Linter とルールファイルへ移した
      - article: hn:46098838
        polarity: positive
        quote: "At HumanLayer, our root CLAUDE.md file is less than sixty lines."
        note: ルートの CLAUDE.md を 60 行未満に保ち、作業別の説明は別ファイルに分けて一覧だけ載せる。効果の計測は無い

  - id: pushy-skill-description
    name: 起動条件を description に集め、強めに書く
    layer: prompt
    problem: 役立つ場面でもモデルがスキルを起動しない（起動漏れ）
    state: partial
    impact: 1
    effort: 1
    gain: core-* スキルの起動漏れが少し減る
    cost: description を書き直すだけ
    self: [core-principal/.apm/skills/core-harness/SKILL.md]
    note: 起動条件を description に集める（"Describe the situation"）ところまで。強めに書く指示は無い
    sources:
      - source: anthropic-skills
        url: https://github.com/anthropics/skills/blob/main/skills/skill-creator/SKILL.md
        evidence: Claude has a tendency to "undertrigger" skills -- to not use them when they'd be useful.
    reports:
      - article: zenn:63d325934ba0de
        polarity: positive
        quote: "自然な文章で呼び出し: codexと相談して とか、 レビューして といった文言で呼び出せる"
        note: description に起動語を並べたら、スラッシュコマンド無しで自然な文から起動した

  - id: mandatory-skill-check
    name: 行動前にスキルの有無を必ず確かめさせる
    layer: prompt
    problem: 当てはまるスキルがあるのに「簡単だから」と使わずに進む
    state: partial
    impact: 2
    effort: 1
    gain: 当てはまるスキルの起動漏れが減る
    cost: 常駐ルールに 1 行足すだけ
    self: [core-principal/.apm/instructions/core-principal.instructions.md]
    note: 場面ごとの橋渡しはあるが、毎回の確認を強制する文言は無い
    sources:
      - source: superpowers
        url: https://github.com/obra/superpowers/blob/main/skills/using-superpowers/SKILL.md
        evidence: If you think there is even a 1% chance a skill might apply to what you are doing, you ABSOLUTELY MUST invoke the skill.

  - id: solution-ladder
    name: 最小解の段階ラダー
    layer: prompt
    problem: 標準ライブラリや既存機能で済む処理を自前で作り込む
    state: adopted
    self: [core-principal/apm.yml（ponytail スキル群を依存に取る）]
    sources:
      - source: ponytail
        url: https://github.com/DietrichGebert/ponytail/blob/main/README.md
        evidence: Before writing code, the agent stops at the first rung that holds

  - id: anti-rationalization-table
    name: 言い訳と反論の表で手順の省略を防ぐ
    layer: prompt
    problem: 「テストは後で」のような言い訳で手順を飛ばす
    state: missing
    impact: 2
    effort: 1
    gain: core-* スキルの手順が「今回は省いてよい」と飛ばされにくくなる
    cost: 既存のスキルに言い訳と反論の表を 1 つずつ足すだけ
    sources:
      - source: addy-agent-skills
        url: https://github.com/addyosmani/agent-skills/blob/main/README.md
        evidence: Every skill includes a table of common excuses agents use to skip steps (e.g., "I'll add tests later") with documented counter-arguments.

  - id: playbook-steps-as-todos
    name: プレイブックの手順を ToDo にそのまま写す
    layer: prompt
    problem: 作業種別ごとに決めた手順を飛ばす。飛ばすなら理由を残させる
    state: missing
    impact: 2
    effort: 1
    gain: ワーカーが core-dispatch などの手順を黙って飛ばさなくなる
    cost: スキルに「手順を ToDo に写す」と 1 段落足すだけ
    sources:
      - source: cursor-pstack
        url: https://github.com/cursor/plugins/blob/main/pstack/skills/poteto-mode/SKILL.md
        evidence: Open a todolist whose first items are the matched playbook's steps, copied in verbatim, before any task-specific todos.

  - id: pause-only-irreversible
    name: 取り消せない操作のときだけ止まる
    layer: prompt
    problem: 取り消せる作業での確認をやめて自律性を上げ、取り消せない操作でだけ人を待つ
    state: partial
    impact: 2
    effort: 2
    gain: デプロイや外部への送信も、git と同じ線で止まる
    cost: ガードの対象を広げるには、何が取り消せないかをコマンドごとに決める必要がある
    self: [core-principal/.apm/hooks/guard-destructive-git.json, docs/agent-harness.md]
    note: git で「復旧できない」操作だけを止める線引きは同じ。デプロイや外部への送信は対象外
    sources:
      - source: cursor-pstack
        url: https://github.com/cursor/plugins/blob/main/pstack/skills/poteto-mode/SKILL.md
        evidence: "Always pause for irreversible writes: force-push to shared branches, deploys, data deletion, customer messages."
    reports:
      - article: devto:4702045
        polarity: positive
        quote: "As you can see, our agent noticed that the tool call was marked as consequential and displayed a confirmation prompt before allowing it to proceed."
        note: 重大と印の付いたツールだけ、実行前に承認を求めるようにした。自作の拡張のデモで、使用報告としては弱い

  - id: brand-contract-file
    name: 仕様ファイルを契約として毎回読ませる
    layer: prompt
    problem: 生成のたびにトークンや文体がぶれる
    state: missing
    impact: 1
    effort: 1
    gain: show-me や site の HTML の見た目が回ごとにぶれなくなる
    cost: DESIGN.md を 1 つ書き、HTML を作るスキルから読ませる
    sources:
      - source: open-design
        url: https://github.com/nexu-io/open-design/blob/main/README.md
        evidence: Every render reads the active package's `DESIGN.md` as the core brand contract.
    reports:
      - article: zenn:04387b258ba54e
        polarity: mixed
        quote: "TOKIUMグリーンを基調とした「いつもの」配色とすることで、既存製品とも調和のとれた統一感のあるデザインになっていると思います"
        note: 社内のカラーパレットをもとに CSS を作らせると既存製品と統一感は出たが、AI っぽさは少し残った

  - id: output-prose-compression
    name: 出力の散文だけを圧縮する
    layer: prompt
    problem: 前置きや言い淀みで出力トークンが膨らむ。コードと警告は原文を保つ
    state: watch
    note: 出力側の圧縮スキルは外し、入力側（headroom）に寄せた。経緯は knowledge-base の tool-research/context-optimization.md
    sources:
      - source: caveman
        url: https://github.com/JuliusBrussee/caveman/blob/main/skills/caveman/SKILL.md
        evidence: Technical terms exact. Code blocks unchanged. Errors quoted exact.

  # =================================================================== harness
  - id: skill-progressive-disclosure
    name: スキルの段階的読み込み
    layer: harness
    problem: 多数の手順書を常駐させず、使うときだけ本文を文脈に入れる
    state: adopted
    self: [core-principal/.apm/skills/]
    sources:
      - source: claude-code
        url: https://code.claude.com/docs/en/skills
        evidence: skill descriptions are loaded into context so Claude knows what's available, but full skill content only loads when invoked.
      - source: codex-cli
        url: https://developers.openai.com/codex/skills
        evidence: Codex start with each skill's name and description, then load the full `SKILL.md` instructions when they decide to use that skill.
      - source: anthropic-skills
        url: https://github.com/anthropics/skills/blob/main/skills/skill-creator/SKILL.md
        evidence: Metadata (name + description) - Always in context (~100 words)
    reports:
      - article: hn:46250332
        polarity: positive
        quote: "I used Claude Opus 4.5’s skill authoring skill to create this skill for creating Datasette plugins"
        note: スキル作成用のスキルで作ったスキルを Codex CLI に入れて使い、プラグインを書かせられた。1 回の試行

  - id: hook-deterministic-block
    name: フックで決定的に拒否する
    layer: harness
