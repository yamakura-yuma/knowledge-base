  # =================================================================== loop
  - id: continue-until-goal
    name: 終了条件を満たすまで自動で続ける（上限付き）
    layer: loop
    problem: 完了前に止まる。人が「続けて」と促さないと長い作業が進まない
    state: missing
    impact: 3
    effort: 2
    gain: ワーカーが完了条件の手前で止まるのを防ぐ。core-dispatch の完了条件をそのまま判定に使える
    cost: Stop フックと、無限ループを防ぐ上限カウンタのスクリプトを 1 本書く
    sources:
      - source: claude-code
        url: https://code.claude.com/docs/en/hooks
        evidence: Prevents Claude from stopping, continues conversation
      - source: codex-cli
        url: https://developers.openai.com/codex/hooks
        evidence: it tells Codex to continue and automatically creates a new continuation prompt
      - source: deepseek-harness
        url: https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/goal/goal-round-driver/README.md
        evidence: automatically continues an active goal in the same session while the agent is idle
      - source: hermes-agent
        url: https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/features/goals.md
        evidence: lightweight judge model checks whether the goal is satisfied by the assistant's last response.
    reports:
      - article: zenn:e3f648e335a947
        polarity: mixed
        quote: "ローカルでテストを回し、CC特有のAgentモードによる自律的な自己修正ループが回り切るのをターミナルのログを見ながらボーッと見つめるだけだ。"
        note: 自己修正ループを回し切らせているが、無限ループに陥ると人が止めている。上限の仕組みは無い

  - id: fresh-agent-rounds
    name: 毎ラウンド新しいエージェントで回す（Ralph ループ）
    layer: loop
    problem: 会話履歴を引き継がず、前ラウンドの短い報告だけを渡して文脈の汚染を避ける
    state: missing
    impact: 2
    effort: 2
    gain: 長い作業でも文脈が汚れず、各ラウンドが短い報告だけを引き継ぐ
    cost: coordinator がラウンドごとにワーカーを立て直す手順を core-dispatch に足す
    sources:
      - source: deepseek-harness
        url: https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/workflow/tool-ralph/README.md
        evidence: runs a foreground sequence of fresh child agents against one immutable objective
    reports:
      - article: zenn:empirical-prompt-tuning
        polarity: positive
        quote: "前回の指摘を全部学習してるのでそりゃ通る。改善した気分だけが残る。毎回新規 dispatch が正解。"
        note: 評価役のサブエージェントを使い回すと前回の指摘を覚えて合格するだけになったので、毎回新しく立てるようにした

  - id: checkable-exit-predicate
    name: 確認できる終了条件を先に決める
    layer: loop
    problem: 長い自律実行が、途中で止まったり条件を緩めて完了扱いにしたりする
    state: partial
    impact: 2
    effort: 2
    gain: 完了条件を人が読まなくても機械が判定できる
    cost: 完了条件を検証できる形（コマンド）で書く規約と、判定するスクリプトが要る
    self: [core-principal/.apm/skills/core-dispatch/SKILL.md]
    note: ワーカーへの依頼に「完了条件（何が観測できたら終わりか）」を必ず書く。自動で判定はしない
    sources:
      - source: cursor-pstack
        url: https://github.com/cursor/plugins/blob/main/pstack/skills/poteto-mode/playbooks/autonomous-run.md
        evidence: State the exit condition as a checkable predicate before the first iteration

  - id: evidence-before-done
    name: 完了は検証の証拠で宣言し、証明したら止まる
    layer: loop
    problem: 検証を走らせずに「直った」と言う。逆に証明後も磨き込みを続けて膨らむ
    state: partial
    impact: 3
    effort: 1
    gain: 検証を走らせずに「直った」と報告する失敗を、全ワーカーでその場で止める
    cost: 常駐ルールに 1 行。機械で守らせるなら Stop フックで検証の実行を確かめる
    self: [core-principal/.apm/prompts/workers.prompt.md]
    note: 報告の evidence 欄に一次情報を書かせる（「順調です」は不可）。完了前のゲートは無い
    sources:
      - source: superpowers
