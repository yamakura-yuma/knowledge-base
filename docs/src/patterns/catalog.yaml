        evidence: NO COMPLETION CLAIMS WITHOUT FRESH VERIFICATION EVIDENCE
      - source: caveman
        url: https://github.com/JuliusBrussee/caveman/blob/main/skills/verify-and-stop/SKILL.md
        evidence: Stop immediately when acceptance proof is complete.

  - id: plan-then-act
    name: 計画と実行を分ける
    layer: loop
    problem: 調べて計画する段階と編集する段階を分け、承認を挟んでから手を動かす
    state: partial
    impact: 1
    effort: 1
    gain: ワーカーが調べる前に編集し始めるのを防ぐ
    cost: Claude Code の計画モードを使うよう依頼文の型に 1 行足す
    self: [core-principal/.apm/skills/core-dispatch/SKILL.md]
    note: coordinator が依頼文（仕様）を書いてから出す。個々のワーカー内での計画ゲートは無い
    sources:
      - source: claude-code
        url: https://code.claude.com/docs/en/permission-modes
        evidence: Claude reads files, runs shell commands to explore, and writes a plan, but does not edit your source.
      - source: deepseek-harness
        url: https://github.com/deepseek-ai/deepseek-harness/blob/master/docs/subsystems/plan.md
        evidence: Plan mode is **soft guidance**.
    reports:
      - article: zenn:8783c6b3ead2cb
        polarity: mixed
        quote: "/grill-meを使い始めてからはプランモードを使わなくなりました。"
        note: 計画モードの代わりに質問攻めのスキルで認識を揃え、その会話履歴を計画としてそのまま実装に移った
      - article: qiita:114f53def8cb0db60f47
        polarity: positive
        quote: "それは、いきなりClaude Codeに作業させないことです。まず4つのドキュメントを用意します。"
        note: PLAN / SPEC / TODO / KNOWLEDGE の 4 文書を先に作らせてから作業させ、手作業と同等の品質のまま速くなった
      - article: qiita:d6c83ea50b82e1c2602c
        polarity: positive
        quote: "Claudeはまず計画を提示し、承認を得てから実装に入り、テストが通ることを確認してから完了を報告しました。"
        note: 「3 ステップ以上は Plan モードで開始」を足す前は 3 回手戻りし、足した後は手戻りが無くなった
      - article: hn:47106686
        polarity: positive
        quote: "The explicit “don’t implement yet” guard is essential. Without it, Claude will jump to code the moment it thinks the plan is good enough."
        note: 計画を直させるたびに「まだ実装するな」と添え、計画が固まる前にコードへ飛ぶのを防いだ（組み込みの plan mode は使わず md ファイル）

  - id: gated-tdd
    name: RED → GREEN → REFACTOR を証跡付きで通す
    layer: loop
    problem: 「TDD で」と言っても途中で忘れてテストを後回しにする
