# ハーネスのパターン・カタログ
#
# このファイルが話題④の正本。行はパターン（ツールではない）。同じ働きを複数の出典が
# 持つときは 1 行にまとめ、sources に並べる。HTML は docs/build.py が
# docs/patterns_page.py（記事の部分は docs/patterns_reports.py）経由で
# docs/site/patterns/index.html に描く。
#
# 証拠は 2 種類あり、混ぜない。
#   - sources（出典）: 「何ができるか」の証拠。公式ドキュメントか README（リポジトリ内の
#     docs / SKILL.md を含む）に限る。evidence にはそのページの原文を短く引く。
#   - reports（使用報告）: 「使った人に効いたか」の証拠。技術記事（kind: article、末尾の
#     articles）に、筆者自身が使った結果として書かれているものに限る。quote には記事の原文を
#     短く引き、polarity に positive（効いた）/ negative（効かなかった・害があった）/ mixed
#     （条件付き）を書く。記事を sources に入れない。機能の説明は reports に入れない。
#
# 縛り:
#   - どちらも原文を引けないものは載せない。
#   - 行は sources か reports のどちらかを持つ。reports だけの行は「記事の使用報告から
#     足した型」の節にまとめ、公式の裏付けが無いことが読んで分かるようにする。
#   - state は自作ハーネス（~/dotfiles の core-principal）を読んで決める。基準は
#     state_criteria。self には ~/dotfiles からの相対パスを書く。
#   - 出典候補（docs/src/data/candidates.json）から出典に上げたものは kind: candidate。
#     ランドスケープの registry.yaml には入れない。

verified: 2026-09-26

state_criteria:
  adopted: 同じ働きをするものが自作ハーネスにあり、ファイルで示せる
  partial: 一部だけある。手動の手順に留まる、対象が狭い、または別の層で代替している
  missing: 自作ハーネスに無い
  watch: 入れないと決めた理由がどこかに書いてある。採否を保留している

# 層ごとの節の冒頭に出す「この層で何が分かったか」。state を変えたら読み直すこと。
layer_findings:
  prompt: 常駐させる文面を絞る型（階層化した指示、ルールは橋渡しだけ）は揃っている。無いのは、手順の省略を防ぐ型（言い訳と反論の表、プレイブックを ToDo に写す）。記事の使用報告はルールを短くする型に集まり（肯定 5）、常設の指示ファイルそのものには否定が 3 件ある。
  harness: いちばん薄い層（23 件中 10 件が未採用）。止めるフックと文脈の節約は揃っているが、権限を段階的に緩める型（サンドボックスと承認のプリセット、呼び出しごとの審査）と、サブエージェントごとの権限分離が無い。
  loop: 振り返りとハーネス自身の検査（make ci、行動評価）は揃っている。無いのは、1 回の作業の中で「続けるか止めるか」を機械が判定する型（目標までの自動継続、TDD ゲート、閾値付きの審査）。記事で肯定の報告が 3 件あるのに未採用なのは、役割を分けたレビューの反復。
  graph: coordinator と worker、worktree による隔離は採用済みで、いちばん埋まっている層。無いのは、複数の案や観点を並列に出して統合する型と、PR やチャットのイベントを起点にエージェントを立てる型。

# 未採用・部分的の行に付ける、取り込んだ場合の効果（impact）と手間（effort）。
# 「次に取り込む候補」はこの 2 つから機械的に並べる。
priority_criteria:
  impact:
    3: 毎セッション・全ワーカーで効き、失敗をその場で防ぐ
    2: 特定の作業の種類で効く
    1: 限られた場面でだけ効く
  effort:
    1: 既存の置き場所（ルール・スキル・フック・agents/）に 1 つ足すだけ
    2: 新しいスクリプトを書くか、設定の方法を調べる必要がある
    3: ハーネスの外の基盤か、Claude Code に無い機能が要る
  order: 効果 − 手間 の大きい順。同点なら効果の高い順、次に使用報告の 肯定 − 否定 の多い順、さらに出典の多い順
  # 使用報告は効果・手間の見積もりを覆さず、同点の並びだけを決める。記事は媒体ごとに反応数の
  # 尺度が違い、本数も話題の流行に引きずられるので、主キーにすると流行順になる。

