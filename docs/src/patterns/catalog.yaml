    reports:
      - article: qiita:356e5f1dba112a075be1
        polarity: positive
        quote: "毎回同じ依頼はサブエージェント化した瞬間に世界が変わる。"
        note: tools を Read・Grep・Bash に絞ったレビュー専任のサブエージェントに任せ、本線を指揮役に保つ

  - id: reversible-output-compression
    name: 大きなツール出力を退避・圧縮し、元に戻せる鍵だけ返す
    layer: harness
    problem: ログや JSON がコンテキストを埋める。原文は必要なときに取り出せるようにする
    state: adopted
