patterns:
  # =================================================================== prompt
  - id: layered-instruction-files
    name: 階層化した常設の指示ファイル
    layer: prompt
    problem: 全体の規約とディレクトリ別の上書きを、必要な範囲にだけ毎セッション読ませる
    state: adopted
    self: [core-principal/.apm/instructions/core-principal.instructions.md, AGENTS.md]
    sources:
      - source: claude-code
        url: https://code.claude.com/docs/en/memory
        evidence: CLAUDE.md and CLAUDE.local.md files in the directory hierarchy above the working directory are loaded at launch.
      - source: codex-cli
        url: https://developers.openai.com/codex/guides/agents-md
        evidence: Files closer to your current directory override earlier guidance because they appear later in the combined prompt.

  - id: rule-as-pointer
    name: 常駐ルールは規範と橋渡しだけにする
    layer: prompt
    problem: 毎プロンプト読まれるファイルが肥大して文脈を食うのを防ぐ。説明はスキルへ逃がす
    state: adopted
    self: [core-principal/.apm/instructions/core-principal.instructions.md]
    sources:
      - source: self
        url: https://github.com/yamakura-yuma/dotfiles/blob/main/core-principal/.apm/instructions/core-principal.instructions.md
        evidence: このファイルは毎プロンプト読み込まれる。だから内容は、数行で完結する規範か、「この場面ではこれを使う」という橋渡しだけに限る。

  - id: pushy-skill-description
    name: 起動条件を description に集め、強めに書く
    layer: prompt
    problem: 役立つ場面でもモデルがスキルを起動しない（起動漏れ）
    state: partial
    self: [core-principal/.apm/skills/core-harness/SKILL.md]
    note: 起動条件を description に集める（"Describe the situation"）ところまで。強めに書く指示は無い
    sources:
      - source: anthropic-skills
        url: https://github.com/anthropics/skills/blob/main/skills/skill-creator/SKILL.md
        evidence: Claude has a tendency to "undertrigger" skills -- to not use them when they'd be useful.

  - id: mandatory-skill-check
    name: 行動前にスキルの有無を必ず確かめさせる
    layer: prompt
    problem: 当てはまるスキルがあるのに「簡単だから」と使わずに進む
    state: partial
    self: [core-principal/.apm/instructions/core-principal.instructions.md]
    note: 場面ごとの橋渡しはあるが、毎回の確認を強制する文言は無い
    sources:
      - source: superpowers
        url: https://github.com/obra/superpowers/blob/main/skills/using-superpowers/SKILL.md
        evidence: If you think there is even a 1% chance a skill might apply to what you are doing, you ABSOLUTELY MUST invoke the skill.

  - id: solution-ladder
    name: 最小解の段階ラダー
    layer: prompt
    problem: 標準ライブラリや既存機能で済む処理を自前で作り込む
    state: adopted
    self: [core-principal/apm.yml（ponytail スキル群を依存に取る）]
    sources:
      - source: ponytail
        url: https://github.com/DietrichGebert/ponytail/blob/main/README.md
        evidence: Before writing code, the agent stops at the first rung that holds

  - id: anti-rationalization-table
    name: 言い訳と反論の表で手順の省略を防ぐ
    layer: prompt
    problem: 「テストは後で」のような言い訳で手順を飛ばす
    state: missing
    sources:
      - source: addy-agent-skills
        url: https://github.com/addyosmani/agent-skills/blob/main/README.md
        evidence: Every skill includes a table of common excuses agents use to skip steps (e.g., "I'll add tests later") with documented counter-arguments.

  - id: playbook-steps-as-todos
    name: プレイブックの手順を ToDo にそのまま写す
    layer: prompt
    problem: 作業種別ごとに決めた手順を飛ばす。飛ばすなら理由を残させる
    state: missing
    sources:
      - source: cursor-pstack
        url: https://github.com/cursor/plugins/blob/main/pstack/skills/poteto-mode/SKILL.md
        evidence: Open a todolist whose first items are the matched playbook's steps, copied in verbatim, before any task-specific todos.

  - id: pause-only-irreversible
    name: 取り消せない操作のときだけ止まる
    layer: prompt
    problem: 取り消せる作業での確認をやめて自律性を上げ、取り消せない操作でだけ人を待つ
    state: partial
    self: [core-principal/.apm/hooks/guard-destructive-git.json, docs/agent-harness.md]
    note: git で「復旧できない」操作だけを止める線引きは同じ。デプロイや外部への送信は対象外
    sources:
      - source: cursor-pstack
        url: https://github.com/cursor/plugins/blob/main/pstack/skills/poteto-mode/SKILL.md
        evidence: "Always pause for irreversible writes: force-push to shared branches, deploys, data deletion, customer messages."

  - id: brand-contract-file
    name: 仕様ファイルを契約として毎回読ませる
    layer: prompt
    problem: 生成のたびにトークンや文体がぶれる
    state: missing
    sources:
      - source: open-design
        url: https://github.com/nexu-io/open-design/blob/main/README.md
        evidence: Every render reads the active package's `DESIGN.md` as the core brand contract.

  - id: output-prose-compression
    name: 出力の散文だけを圧縮する
    layer: prompt
    problem: 前置きや言い淀みで出力トークンが膨らむ。コードと警告は原文を保つ
    state: watch
    note: 出力側の圧縮スキルは外し、入力側（headroom）に寄せた。経緯は knowledge-base の tool-research/context-optimization.md
    sources:
      - source: caveman
        url: https://github.com/JuliusBrussee/caveman/blob/main/skills/caveman/SKILL.md
        evidence: Technical terms exact. Code blocks unchanged. Errors quoted exact.

  # =================================================================== harness
  - id: skill-progressive-disclosure
    name: スキルの段階的読み込み
    layer: harness
    problem: 多数の手順書を常駐させず、使うときだけ本文を文脈に入れる
    state: adopted
    self: [core-principal/.apm/skills/]
    sources:
      - source: claude-code
        url: https://code.claude.com/docs/en/skills
        evidence: skill descriptions are loaded into context so Claude knows what's available, but full skill content only loads when invoked.
      - source: codex-cli
        url: https://developers.openai.com/codex/skills
        evidence: Codex start with each skill's name and description, then load the full `SKILL.md` instructions when they decide to use that skill.
      - source: anthropic-skills
        url: https://github.com/anthropics/skills/blob/main/skills/skill-creator/SKILL.md
        evidence: Metadata (name + description) - Always in context (~100 words)

  - id: hook-deterministic-block
    name: フックで決定的に拒否する
    layer: harness
    problem: 指示文は守られる保証が無いので、禁止したい操作は機械的に止める
    state: adopted
    self: [core-principal/.apm/hooks/guard-default-branch.json, core-principal/.apm/hooks/guard-destructive-git.json, core-principal/.apm/hooks/guard-coordinator-edit.json]
    sources:
      - source: claude-code
        url: https://code.claude.com/docs/en/memory
        evidence: To block an action regardless of what Claude decides, use a PreToolUse hook instead.
      - source: self
        url: https://github.com/yamakura-yuma/dotfiles/blob/main/docs/agent-harness.md
        evidence: 線を引いているのは「危なく聞こえるか」ではなく「復旧できないか」です。

  - id: advisory-prompt-hook
    name: 毎プロンプトに規範を差し込む助言フック
    layer: harness
    problem: 人がコマンドを打たなくても、その場所で守るべき規範を毎回思い出させる
    state: adopted
    self: [core-principal/.apm/hooks/dispatch-in-coordinator.json]
    sources:
      - source: self
        url: https://github.com/yamakura-yuma/dotfiles/blob/main/core-principal/README.md
        evidence: on every prompt in the coordinator it appends the dispatch norm to the message, so the layer holds without a human typing a command.

  - id: subagent-rule-injection
    name: サブエージェントにも同じルールを注入する
    layer: harness
    problem: 親に入れたルールが Task で起動したサブエージェントに届かない
    state: watch
    self: [core-principal/apm.yml]
    note: ponytail はスキルだけを取り、フックは毎回走るのを避けて意図的に外している（apm.yml のコメント）
    sources:
      - source: ponytail
        url: https://github.com/DietrichGebert/ponytail/blob/main/hooks/ponytail-subagent.js
        evidence: When ponytail mode is active, inject the same ruleset into each subagent.

  - id: fail-closed-approval
    name: 承認ゲートはフェイルクローズ
    layer: harness
    problem: 承認側が居ない・壊れているときにゲートが開いてしまう
    state: watch
    self: [docs/agent-harness.md]
    note: 自作のガードは判断できないとき exit 0 で素通りする（フェイルオープン）と明記している
    sources:
      - source: deepseek-harness
        url: https://github.com/deepseek-ai/deepseek-harness/blob/master/docs/subsystems/approval.md
        evidence: "`ApprovalOutcome` is closed and fail-closed."

  - id: sandbox-approval-presets
    name: サンドボックスと承認ポリシーを束ねる
    layer: harness
    problem: 境界の内側は確認なしで進ませ、外へ出るときだけ人に聞く。2 つのつまみを 1 つの選択肢にする
    state: missing
    sources:
      - source: codex-cli
        url: https://developers.openai.com/codex/sandboxing
        evidence: When a task stays inside those boundaries, the agent can keep moving without stopping for confirmation.
      - source: deepseek-harness
        url: https://github.com/deepseek-ai/deepseek-harness/blob/master/docs/subsystems/permission-presets.md
        evidence: bundles two independent enforcement knobs — sandbox mode (`sandbox/mode`) and approval policy (`approval/policy`) — into named presets

  - id: command-prefix-policy
    name: コマンド接頭辞で allow / prompt / forbid を振り分ける
    layer: harness
    problem: サンドボックスの外で走らせてよいコマンドを規則で決める
    state: partial
    self: [core-principal/.apm/hooks/scripts/guard-destructive-git.sh]
    note: 破壊的な git 4 種だけを拒否する。許可側の規則は持たない
    sources:
      - source: codex-cli
        url: https://developers.openai.com/codex/exec-policy
        evidence: Use rules to control which commands Codex can run outside the sandbox.

  - id: per-call-llm-review
    name: ツール呼び出しごとに LLM が審査する
    layer: harness
    problem: 毎回人に承認を求めずに、危険な操作だけを人に回す
    state: missing
    sources:
      - source: deepseek-harness
        url: https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/experimental/auto-review/README.md
        evidence: Before each native or PTC inner tool call, the current agent's provider and model assess the pending action

  - id: edit-scope-freeze
    name: 編集してよい範囲を凍結する
    layer: harness
    problem: デバッグ中に関係ないコードまで「ついでに」直す
    state: partial
    self: [core-principal/.apm/hooks/guard-coordinator-edit.json]
    note: coordinator での編集を丸ごと拒否するだけ。パス単位の凍結は無い
    sources:
      - source: gstack
        url: https://github.com/garrytan/gstack/blob/main/freeze/SKILL.md.tmpl
        evidence: Blocks Edit and Write outside the allowed path.

  - id: subagent-scoped-tools
    name: サブエージェントごとに文脈と権限を絞る
    layer: harness
    problem: 副作業を別の文脈に隔離し、使えるツールも役割ごとに制限する
    state: missing
    note: core-harness に agents/ の置き場所は書いてあるが、定義したサブエージェントは無い
    sources:
      - source: claude-code
        url: https://code.claude.com/docs/en/sub-agents
        evidence: Each subagent runs in its own context window with a custom system prompt, specific tool access, and independent permissions.

  - id: reversible-output-compression
    name: 大きなツール出力を退避・圧縮し、元に戻せる鍵だけ返す
    layer: harness
    problem: ログや JSON がコンテキストを埋める。原文は必要なときに取り出せるようにする
    state: adopted
    self: [host-apm.yml（headroom MCP）, core-principal/.apm/skills/core-tools/SKILL.md]
    sources:
      - source: caveman
        url: https://github.com/JuliusBrussee/caveman/blob/main/README.md
        evidence: Every squeezed byte gets a backup, so the agent can always pull the original back.
      - source: deepseek-harness
        url: https://github.com/deepseek-ai/deepseek-harness/blob/master/docs/subsystems/spill.md
        evidence: persists caller-provided text and returns a model-facing locator with retrieval guidance.

  - id: programmatic-tool-calling
    name: スクリプトからツールを呼び、途中結果を文脈に入れない
    layer: harness
    problem: 多段のツール呼び出しで途中結果が全部コンテキストに積もる
    state: missing
    sources:
      - source: hermes-agent
        url: https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/features/code-execution.md
        evidence: intermediate tool results never enter the context window

  - id: black-box-scripts
    name: 付属スクリプトは読まずに実行する
    layer: harness
    problem: 大きな補助スクリプトのソースを読み込んで文脈を汚す
    state: missing
    sources:
      - source: anthropic-skills
        url: https://github.com/anthropics/skills/blob/main/skills/webapp-testing/SKILL.md
        evidence: They exist to be called directly as black-box scripts rather than ingested into your context window.

  - id: index-first-search
    name: 検索の前に索引へ誘導する
    layer: harness
    problem: grep と逐次読みでトークンを浪費し、構造的な索引を使わない
    state: partial
    self: [core-principal/.apm/instructions/core-principal.instructions.md, core-principal/.apm/skills/core-tools/SKILL.md]
    note: ルールで「まず索引」と書くだけ。検索前に割り込むフックは無い
    sources:
      - source: graphify
        url: https://github.com/Graphify-Labs/graphify/blob/v8/README.md
        evidence: a hook fires automatically before search-style tool calls

  - id: index-auto-refresh
    name: git フックで索引を自動再構築する
    layer: harness
    problem: コードが変わるたびに索引が古くなる
    state: partial
    self: [core-principal/.apm/skills/core-tools/SKILL.md]
    note: 「変更したら graphify update .」は手順として書くだけで、git フックは入れていない
    sources:
      - source: graphify
        url: https://github.com/Graphify-Labs/graphify/blob/v8/README.md
        evidence: "`git commit` | rebuilds automatically — AST only, no API cost"

  - id: provenance-tags
    name: 索引の関係に「抽出 / 推論」の出所を付ける
    layer: harness
    problem: 索引上の関係が確認済みか推測かを区別できない
    state: adopted
    self: [core-principal/.apm/skills/core-tools/SKILL.md（graphify を使う）]
    sources:
      - source: graphify
        url: https://github.com/Graphify-Labs/graphify/blob/v8/README.md
        evidence: every inferred relationship is marked `EXTRACTED`, `INFERRED`, or `AMBIGUOUS`.

  - id: strategic-compaction
    name: 作業の区切りでコンパクションを促す
    layer: harness
    problem: 自動コンパクションが作業の途中で走り、必要な文脈を失う
    state: missing
    sources:
      - source: ecc
        url: https://github.com/affaan-m/ECC/blob/main/skills/strategic-compact/SKILL.md
        evidence: "Auto-compaction triggers at arbitrary points: - Often mid-task, losing important context"

  - id: bounded-frozen-memory
    name: 上限付きで、開始時に固定するメモリ
    layer: harness
    problem: 永続メモリの肥大と、途中の書き換えによるプレフィックスキャッシュの破壊
    state: missing
    sources:
      - source: hermes-agent
        url: https://github.com/NousResearch/hermes-agent/blob/main/website/docs/user-guide/features/memory.md
        evidence: The system prompt injection is captured once at session start and never changes mid-session.

  - id: search-before-authoring
    name: 書く前に公開スキルを探し、コミット固定で取り込む
    layer: harness
    problem: 他人が磨いた知識を使わずに自作し、しかも上流の変化で黙って壊れる
    state: adopted
    self: [core-principal/.apm/skills/core-harness/SKILL.md, core-principal/apm.yml]
    sources:
      - source: self
        url: https://github.com/yamakura-yuma/dotfiles/blob/main/core-principal/.apm/skills/core-harness/SKILL.md
        evidence: Where something fits, **adopt** it — take it as an apm dependency — or **cite** it

  - id: generated-verification-skill
    name: 実アプリを操作する検証手段をプロジェクトごとに作る
    layer: harness
    problem: 「コンパイルが通った」ではなく、利用者と同じ操作で振る舞いを証明する
