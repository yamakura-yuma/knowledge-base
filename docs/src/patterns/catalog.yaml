    sources:
      - source: caveman
        url: https://github.com/JuliusBrussee/caveman/blob/main/README.md
        evidence: Every squeezed byte gets a backup, so the agent can always pull the original back.
      - source: deepseek-harness
        url: https://github.com/deepseek-ai/deepseek-harness/blob/master/docs/subsystems/spill.md
        evidence: persists caller-provided text and returns a model-facing locator with retrieval guidance.
    reports:
      - article: hn:47193064
        polarity: positive
        quote: "The raw page never enters context."
        note: 取得したページは索引に入れて文脈には入れず、必要な部分だけ原文のまま検索で取り出す

  - id: programmatic-tool-calling
    name: スクリプトからツールを呼び、途中結果を文脈に入れない
    layer: harness
    problem: 多段のツール呼び出しで途中結果が全部コンテキストに積もる
    state: missing
    impact: 2
    effort: 3
    gain: 多段の調査で途中結果が文脈に積もらなくなる
