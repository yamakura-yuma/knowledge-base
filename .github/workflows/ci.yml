# PR のゲート。中身は justfile の `ci` レシピで、再利用 workflow はそれを走らせるだけ。
# 型は https://github.com/yamakura-yuma/dotfiles/blob/main/docs/gates.md
# `paths` で絞らない（飛ばされた必須チェックは Pending のままマージを止めるため）。
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ci:
    uses: yamakura-yuma/dotfiles/.github/workflows/just-ci.yml@36b87604c93cc0ae5748b04327edc0c666b74fdc
